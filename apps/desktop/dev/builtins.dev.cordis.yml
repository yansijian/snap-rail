# The dev overlay — the base rows the Vite harness runs with. The
# production layer ships the same base (see resources/builtins.cordis.yml);
# installable plugins (framework, drivers, suites) never ride this file —
# they come from the plugin pool, like production: pack the client repo,
# build the standalone plugin repos, then `install-dev-plugins` the zips
# into the dev home. This file lives outside resources/ on purpose:
# packaging can never ship it. Rows resolve through the workspace's
# node_modules (appRoot), not the plugin pool.
- id: timer
  name: '@snap-rail/cordis-plugin-timer'
- id: settings
  name: '@snap-rail/settings'
- id: store-sqlite
  name: '@snap-rail/store-sqlite'
- id: audit
  name: '@snap-rail/audit'
- id: gateway
  name: '@snap-rail/gateway'
  config:
    name: snap-rail
    version: 0.1.3
    bin: desktop
- id: equipment
  name: '@snap-rail/equipment'
- id: equipment-rpc
  name: '@snap-rail/equipment/rpc'
- id: plugins-rpc
  name: '@snap-rail/app-boot/rpc'
- id: station-rpc
  name: '@snap-rail/station-rpc'
