# The dev overlay — the factory rows the Vite harness runs with. The
# production layer ships the same core (see resources/builtins.cordis.yml);
# drivers, skins, pages and suites never ride this file — they come from the
# plugin pool, like production. This file lives outside resources/ on purpose:
# packaging can never ship it. Rows resolve through the workspace's
# node_modules (appRoot), not the plugin pool.
- id: timer
  name: '@snap-rail/cordis-plugin-timer'
- id: settings
  name: '@snap-rail/settings'
- id: store-sqlite
  name: '@snap-rail/store-sqlite'
  default: true
- id: audit
  name: '@snap-rail/audit'
- id: gateway
  name: '@snap-rail/gateway'
  config:
    name: snap-rail
    version: 0.3.0
    bin: desktop
- id: equipment
  name: '@snap-rail/equipment'
  default: true
- id: equipment-rpc
  name: '@snap-rail/equipment/rpc'
  default: true
- id: plugins-rpc
  name: '@snap-rail/app-boot/rpc'
- id: station-rpc
  name: '@snap-rail/station-rpc'
