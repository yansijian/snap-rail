- id: timer
  name: '@snap-rail/cordis-plugin-timer'
- id: settings
  name: '@snap-rail/settings'
- id: store
  name: '@snap-rail/store'
- id: audit
  name: '@snap-rail/audit'
- id: gateway
  name: '@snap-rail/gateway'
  config:
    name: snap-rail
    version: 0.1.0
    bin: desktop
- id: field
  name: '@snap-rail/field'
- id: field-rpc
  name: '@snap-rail/field/rpc'
- id: plugins-rpc
  name: '@snap-rail/app-boot/rpc'
- id: station-rpc
  name: '@snap-rail/station-rpc'
# 班产统计: counts the bound output point into three 8-hour shift buckets
# (snap-rail.db), anchored at login time; the production page is a pure
# projection over its production/stats-changed frame.
- id: production-stats
  name: '@snap-rail/production-stats'
  config:
    flushMs: 1000
# ModbusTCP: devices live in the driver's store tables and are edited from
# the settings dialog (modbus-station); the driver mounts with an empty
# table and reconciles on modbus/config-changed.
- id: driver-modbus
  name: '@snap-rail/driver-modbus'
- id: modbus-rpc
  name: '@snap-rail/driver-modbus/rpc'
# Phase-1 demo resident: the dashboard's live source until connection
# management lands; the user layer can disable or re-point it.
- id: mock-demo
  name: '@snap-rail/driver-mock'
  config:
    connection: demo
    title: Demo simulator
    periodMs: 500
    points:
      - name: temperature
        group: main
        type: float
      - name: counter
        group: main
        type: int
      - name: running
        group: main
        type: bool
      - name: device
        group: main
        type: string
