- id: timer
  name: '@snap-rail/cordis-plugin-timer'
- id: settings
  name: '@snap-rail/settings'
- id: store
  name: '@snap-rail/store'
- id: audit
  name: '@snap-rail/audit'
- id: gateway
  name: '@snap-rail/gateway'
  config:
    name: snap-rail
    version: 0.1.0
    bin: desktop
- id: field
  name: '@snap-rail/field'
- id: field-rpc
  name: '@snap-rail/field/rpc'
- id: plugins-rpc
  name: '@snap-rail/app-boot/rpc'
- id: station-rpc
  name: '@snap-rail/station-rpc'
# 班产统计: counts the bound output point into three 8-hour shift buckets
# (snap-rail.db), anchored at login time. The host face of the production
# package — the page rides the renderer tree, and the plugin-management page
# groups both rows under one toggle.
- id: production-stats
  name: '@snap-rail/process-production/stats'
  config:
    flushMs: 1000
# ModbusTCP: devices live in the driver's store tables and are edited from
# the settings dialog (the package's ./station face, a renderer occupant);
# one entry mounts the driver and its field.modbus bridge together — the
# plugin-management page groups both rows of this package under one toggle.
- id: driver-modbus
  name: '@snap-rail/driver-modbus'
# Phase-1 demo resident: the dashboard's live source until connection
# management lands; the user layer can disable or re-point it.
- id: mock-demo
  name: '@snap-rail/driver-mock'
  config:
    connection: demo
    title: Demo simulator
    periodMs: 500
    points:
      - name: temperature
        group: main
        type: float
      - name: counter
        group: main
        type: int
      - name: running
        group: main
        type: bool
      - name: device
        group: main
        type: string
