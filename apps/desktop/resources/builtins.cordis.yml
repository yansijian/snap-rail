# The shipped built-in layer — base only. Everything beyond the base layer
# (store backends, the equipment base and drivers, the UI framework and its
# stations, tools, suites) installs from zips: the settings page's 安装插件
# or, before any framework is enabled, the kernel's drag-to-install
# bootstrap page. The dev overlay (dev/builtins.dev.cordis.yml) is the
# full-list variant Vite runs use; it never ships.
- id: timer
  name: '@snap-rail/cordis-plugin-timer'
- id: settings
  name: '@snap-rail/settings'
- id: audit
  name: '@snap-rail/audit'
- id: gateway
  name: '@snap-rail/gateway'
  config:
    name: snap-rail
    version: 0.1.3
    bin: desktop
- id: plugins-rpc
  name: '@snap-rail/app-boot/rpc'
- id: station-rpc
  name: '@snap-rail/station-rpc'
