# Packaging: phase 1 ships a directory layout, not an asar archive — plugins
# load through real file:// URLs the loader imports directly, and the built-in
# layer file stays watchable for hot recomposition. Revisit with a custom
# protocol when tamper resistance matters.
appId: io.snaprail.desktop
productName: snap-rail
directories:
  output: release-out
files:
  - dist/**
  - resources/**
  - package.json
asar: false
win:
  target:
    - nsis
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
# Update channel: the generic provider below is baked into the packaged
# app-update.yml that electron-updater reads at runtime. The URL is the one
# line to change when cutting a release (it must serve the installer, the
# blockmap, and latest.yml); a deployment can override it per seat with the
# `update.feedUrl` settings key, no repack needed.
publish:
  provider: generic
  url: https://updates.example.com/snap-rail/
