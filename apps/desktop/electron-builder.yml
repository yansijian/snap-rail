# Packaging: phase 1 ships a directory layout, not an asar archive — plugins
# load through real file:// URLs the loader imports directly, and the built-in
# layer file stays watchable for hot recomposition. Revisit with a custom
# protocol when tamper resistance matters.
appId: io.snaprail.desktop
productName: snap-rail
directories:
  output: release-out
files:
  - dist/**
  - resources/**
  - package.json
asar: false
win:
  target:
    - nsis
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
  # One square PNG (>=256px) drives every Windows icon: app exe, NSIS
  # installer and uninstaller all derive from it (electron-builder converts
  # to .ico internally). Source: website/public/logo.svg rasterized at 512.
  icon: build/icon.png
  # No Authenticode cert in play: skip signing everywhere (keeps resedit
  # resource editing — icon/version metadata). Required for the Linux CI
  # cross-build, where the default test-sign path would demand wine.
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-${version}-${arch}-setup.${ext}
# Electron 发行包走 npmmirror：github.com/electron/electron/releases 的下载
# 链路对 CI/国内机器都会间歇 504（zip 拉完卡 SHASUMS256.txt），镜像目录完整
# （zip + SHASUMS256.txt 同源），@electron/get 逐字节校验签名清单，完整性
# 不依赖源站。electron-builder 26 只认这个配置键（ELECTRON_MIRROR env 被它
# 故意绕过）；builder 工具链（nsis/winCodeSign）另走 release.yml 的
# ELECTRON_BUILDER_BINARIES_MIRROR。
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
# Update channel seat: electron-updater reads the publish provider at
# runtime (this config packs into app-update.yml as the built-in default);
# a deployment overrides it per terminal with the `update.feedUrl` settings
# key — no repack needed. The URL is derived from `feed-base.json` by
# scripts/stamp-feed-default.ts (the same base serves plugins.feedUrls and
# the website downloads); never hand-edit it — `verify:feed-base` fails when
# this file, defaults.json, and the website catalog disagree. An intranet CI
# may stamp its own base at packaging time; the factory defaults always name
# the public base.
publish:
  - provider: generic
    url: https://snap-rail-feed.oss-cn-shenzhen.aliyuncs.com/feed/
