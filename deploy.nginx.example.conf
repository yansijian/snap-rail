# Local development feed. Point the root at the output of
# `pnpm run publish:local` or copy dist-publish/plugins into the feed root.
server {
    listen 8088;
    server_name 127.0.0.1 localhost;

    location /plugins/ {
        alias D:/snap-rail-feed/plugins/;
        add_header Cache-Control "no-cache";
        add_header Access-Control-Allow-Origin "*";
        types {
            application/json json;
            application/zip zip;
            text/yaml yml yaml;
        }
    }

    location /desktop/ {
        alias D:/snap-rail-feed/desktop/;
        add_header Cache-Control "no-cache";
    }

    location / {
        alias D:/snap-rail-feed/site/;
    }
}
