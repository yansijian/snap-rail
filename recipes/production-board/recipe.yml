# 产线看板组合：标准基座 + 采集/作业套件，装完按 readme 建一组演示
# 设备即可看到完整效果。本文件是组合包（production-board.zip）的唯一清单：
# 根目录 recipe.yml + plugins/*.zip（逐个签名的一方插件包）。
id: production-board
version: 1.1.0
title: 产线看板
kind: scenario
description: 标准基座之上加装 ModbusTCP 采集与终端作业套件——设备管理、点采集、班产看板一条链（班产统计由套件自带）。
plugins:
  - name: '@snap-rail/store-sqlite'
  - name: '@snap-rail/equipment'
  - name: '@snap-rail/equipment/rpc'
  - name: '@snap-rail/framework-shadcn'
  - name: '@snap-rail/equipment-station'
  - name: '@snap-rail/driver-modbus'
  - name: '@snap-rail/suite-terminal-ops'
