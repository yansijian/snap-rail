# 标准基座组合：一键装成可用的空终端，也是三方插件的公共靶台。
# 本文件是组合包（<id>.zip）的唯一清单：根目录 recipe.yml + plugins/*.zip
# （逐个签名的一方差件包）。组合序 = 出厂内置 → 预设（落地为
# recipe-standard-base.yml）→ 用户层；离线安装由客户端解压后批量安装成员、
# 再原子写入预设文件。
id: standard-base
version: 1.1.0
title: 标准基座
kind: base
description: 存储后端、设备底座、界面框架（自带设置中心与插件管理）与统一设备管理页——一键装成可用的空终端。
plugins:
  - name: '@snap-rail/store-sqlite'
  - name: '@snap-rail/equipment'
  - name: '@snap-rail/equipment/rpc'
  - name: '@snap-rail/framework-shadcn'
  - name: '@snap-rail/equipment-station'
