name: collect-feed
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['feed-sources.json', 'scripts/collect-feed.ts', 'scripts/pack-plugins.ts', 'scripts/publish.ts', 'packages/**', '.gitea/workflows/collect-feed.yml']
  schedule:
    - cron: '0 3 * * *'

# 国内 runner 不走 marketplace（与 admin 仓 CI 同策略）：git clone 检出、
# npmmirror 装 pnpm；@snap-rail scope 走本机 Gitea npm（凭据注入 ~/.npmrc）。
jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      # 只装 electron 的 npm 包（类型），二进制不下载——本流水线不打包桌面应用
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Checkout
        # job 容器在默认桥接网络，解析不了 runner 的内网注册地址（gitea:3000），
        # 检出地址必须显式指向宿主机发布端口。
        env:
          GIT_SERVER_URL: http://192.168.1.9:3000
        run: |
          GIT_SERVER_URL="${GIT_SERVER_URL:-$GITHUB_SERVER_URL}"
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            -c credential.helper='!f() { echo "username=${{ github.actor }}"; echo "password=${{ secrets.GITEA_TOKEN }}"; }; f' \
            "$GIT_SERVER_URL/$GITHUB_REPOSITORY.git" .
      - name: pnpm + 源凭据（国内源；@snap-rail 走本机 Gitea）
        env:
          FEED_TOKEN: ${{ secrets.FEED_TOKEN }}
        run: |
          npm config set registry https://registry.npmmirror.com
          npm install -g pnpm@11.22.0
          printf '//192.168.1.9:3000/api/packages/snap-rail/npm/:_authToken=%s\n' "$FEED_TOKEN" >> ~/.npmrc
          pnpm -v
      - name: download latest release zips from the plugin repos
        env:
          FEED_TOKEN: ${{ secrets.FEED_TOKEN }}
        run: |
          mkdir -p collect-dl
          node -e '
            const fs = require("node:fs");
            const sources = JSON.parse(fs.readFileSync("feed-sources.json", "utf8")).sources;
            (async () => {
              for (const s of sources) {
                const rel = await fetch(`http://192.168.1.9:3000/api/v1/repos/snap-rail/${s.repo}/releases/latest`, { headers: { Authorization: `token ${process.env.FEED_TOKEN}` } });
                if (!rel.ok) { console.error(`skip ${s.repo}: release lookup ${rel.status}`); continue; }
                const release = await rel.json();
                const asset = (release.assets ?? []).find(a => a.name === s.asset);
                if (!asset) { console.error(`skip ${s.repo}: no asset ${s.asset}`); continue; }
                const zip = await fetch(asset.browser_download_url, { headers: { Authorization: `token ${process.env.FEED_TOKEN}` } });
                if (!zip.ok) { console.error(`skip ${s.repo}: download ${zip.status}`); continue; }
                fs.writeFileSync(`collect-dl/${s.asset}`, Buffer.from(await zip.arrayBuffer()));
                console.log(`downloaded ${s.asset} from ${s.repo} (${release.tag_name})`);
              }
            })();
          '
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run build
      - name: collect + publish feed (base + collected)
        env:
          GITEA_TOKEN: ${{ secrets.FEED_TOKEN }}
          SIGN_KEY: ${{ secrets.RELEASE_PRIVATE_PEM }}
          KEY_ID: ${{ secrets.RELEASE_KEY_ID }}
        run: |
          printf '%s' "$SIGN_KEY" | base64 -d > release.private.pem
          pnpm exec tsx scripts/collect-feed.ts --from collect-dl
          pnpm run publish -- --sign-key release.private.pem --key-id "$KEY_ID" --publisher snap-rail --market collect-out
          rm release.private.pem
      - name: verify assembled feed
        run: pnpm run verify:market -- --feed dist-publish/plugins --trust keys/gitea-main-2026.trust.json
