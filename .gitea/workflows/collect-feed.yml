name: collect-feed
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['feed-sources.json', 'scripts/collect-feed.ts', 'scripts/pack-plugins.ts', 'scripts/publish.ts', 'packages/**', '.gitea/workflows/collect-feed.yml']
  schedule:
    - cron: '0 3 * * *'

# 国内 runner 不走 marketplace（与 admin 仓 CI 同策略）：git clone 检出、
# npmmirror 装 pnpm；@snap-rail scope 走本机 Gitea npm（凭据注入 ~/.npmrc）。
# 这把采集的是 org 自己拆分仓的源码产物（`--collect`）——社区插件不在
# 这里聚合，作者在自己的 Release 发布、用户自行添加插件源。
jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      # 只装 electron 的 npm 包（类型），二进制不下载——本流水线不打包桌面应用
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      SNAP_RAIL_EXTERNAL_REPOS: snap-rail-driver-modbus,snap-rail-driver-enip
    steps:
      - name: Checkout
        # job 容器在默认桥接网络，解析不了 runner 的内网注册地址（gitea:3000），
        # 检出地址必须显式指向宿主机发布端口。
        env:
          GIT_SERVER_URL: http://192.168.1.9:3000
        run: |
          GIT_SERVER_URL="${GIT_SERVER_URL:-$GITHUB_SERVER_URL}"
          git clone --depth 1 --branch "$GITHUB_REF_NAME" \
            -c credential.helper='!f() { echo "username=${{ github.actor }}"; echo "password=${{ secrets.GITEA_TOKEN }}"; }; f' \
            "$GIT_SERVER_URL/$GITHUB_REPOSITORY.git" .
      - name: pnpm + 源凭据（国内源；@snap-rail 走本机 Gitea）
        env:
          FEED_TOKEN: ${{ secrets.FEED_TOKEN }}
        run: |
          npm config set registry https://registry.npmmirror.com
          npm install -g pnpm@11.22.0
          printf '//192.168.1.9:3000/api/packages/snap-rail/npm/:_authToken=%s\n' "$FEED_TOKEN" >> ~/.npmrc
          pnpm -v
      - name: download desktop installer trio from the main repo release
        env:
          FEED_TOKEN: ${{ secrets.FEED_TOKEN }}
        run: |
          mkdir -p apps/desktop/release-out
          node -e '
            (async () => {
              const api = "http://192.168.1.9:3000/api/v1/repos/snap-rail/snap-rail";
              const headers = { Authorization: `token ${process.env.FEED_TOKEN}` };
              const rel = await fetch(`${api}/releases/latest`, { headers });
              if (!rel.ok) { console.error(`skip desktop: release lookup ${rel.status}（build-desktop 未跑过则正常跳过）`); return; }
              const release = await rel.json();
              const trio = (release.assets ?? []).filter(a => a.name === "latest.yml" || a.name.endsWith(".exe") || a.name.endsWith(".exe.blockmap"));
              if (trio.length === 0) { console.error("skip desktop: release has no installer assets"); return; }
              const fs = require("node:fs");
              for (const asset of trio) {
                const res = await fetch(asset.browser_download_url, { headers });
                if (!res.ok) { console.error(`skip desktop asset ${asset.name}: ${res.status}`); continue; }
                fs.writeFileSync(`apps/desktop/release-out/${asset.name}`, Buffer.from(await res.arrayBuffer()));
                console.log(`downloaded ${asset.name} from release ${release.tag_name}`);
              }
            })();
          '
      - name: stage split plugin repos (workspace deps)
        env:
          FEED_TOKEN: ${{ secrets.FEED_TOKEN }}
        run: |
          git config --global credential.helper '!f() { echo "username=${{ github.actor }}"; echo "password=$FEED_TOKEN"; }; f'
          SNAP_RAIL_EXTERNAL_BASE=http://192.168.1.9:3000/snap-rail node scripts/setup-external.mjs
      - run: pnpm install --no-frozen-lockfile
      - name: bootstrap base declarations + split faces
        run: |
          pnpm exec tsc -b tsconfig.bootstrap.json
          pnpm exec tsdown --config tsdown.bootstrap.config.ts
          pnpm --filter @snap-rail/driver-modbus run build
          pnpm --filter @snap-rail/driver-enip run build
      - run: pnpm run build
      - name: pack first-party split plugins (signed)
        env:
          SIGN_KEY: ${{ secrets.RELEASE_PRIVATE_PEM }}
          KEY_ID: ${{ secrets.RELEASE_KEY_ID }}
        run: |
          printf '%s' "$SIGN_KEY" | base64 -d > release.private.pem
          mkdir -p collect-dl
          for repo in snap-rail-driver-modbus snap-rail-driver-enip; do
            node packages/base/plugin-sdk/lib/cli.js pack "external/$repo" \
              --out "external/$repo/dist" \
              --sign-key release.private.pem \
              --key-id "$KEY_ID" \
              --publisher snap-rail
            cp "external/$repo"/dist/*.zip collect-dl/
          done
      - name: collect + publish feed (base + collected)
        env:
          GITEA_TOKEN: ${{ secrets.FEED_TOKEN }}
          KEY_ID: ${{ secrets.RELEASE_KEY_ID }}
        run: |
          # deploy.config.json 现场文件不进仓——CI 里按本机 Gitea 现场生成。
          # 滚动 Release(feed tag):插件源与应用更新源同址平铺。
          cat > deploy.config.json <<'JSON'
          {
            "targets": [
              { "kind": "gitea", "url": "http://192.168.1.9:3000", "owner": "snap-rail", "repo": "snap-rail" }
            ],
            "feedTag": "feed"
          }
          JSON
          pnpm exec tsx scripts/collect-feed.ts --from collect-dl --provider gitea
          pnpm run publish -- --sign-key release.private.pem --key-id "$KEY_ID" --publisher snap-rail --collect collect-out
          rm release.private.pem
      - name: verify assembled feed
        run: pnpm run verify:feed -- --feed dist-publish/plugins --trust apps/desktop/resources/trusted-release-keys.json
