name: npm

# Publish the public authoring closure (@snap-rail/*) to npm after a versioned
# release succeeds. plugin-kit/plugin-sdk/util/protocol/store/equipment plus
# the vendored Cordis runtime, the base service/type packages plugin-sdk's
# ./api facade re-exports (gateway/connection/settings), and the UI framework
# (staged from its split repo) are the packages an independent plugin repo
# needs; everything else stays app-internal.
on:
  # Manual until the repository owns an npm token: a tag push must not turn
  # the release run red just because the SDK registry credential is absent.
  workflow_dispatch:

permissions:
  contents: read
  # Trusted publishing (OIDC): pnpm presents a short-lived workflow identity to
  # npm instead of a long-lived NPM_TOKEN. NPM_TOKEN stays as an optional
  # fallback for as long as it exists.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: ./.github/actions/prepare-workspace
      - run: pnpm run build
      - name: publish the public closure (idempotent per version)
        # The closure list (incl. the framework from its split repo) and the
        # publish-time peer filter live in one script so external installs
        # can never meet an unpublished peer again.
        run: node scripts/publish-npm.mjs
