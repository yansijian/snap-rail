name: npm

# Publish the public authoring closure (@snap-rail/*) to npm after a versioned
# release succeeds. plugin-kit/plugin-sdk/util/protocol/store/equipment plus
# the vendored Cordis runtime are the packages an independent plugin repo
# needs; everything else stays app-internal.
on:
  # Manual until the repository owns an npm token: a tag push must not turn
  # the release run red just because the SDK registry credential is absent.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: ./.github/actions/prepare-workspace
      - run: pnpm run build
      - name: publish the public closure (idempotent per version)
        run: |
          for dir in \
            vendor/cosmokit \
            vendor/cordis \
            packages/base/util \
            packages/base/protocol \
            packages/base/plugin-kit \
            packages/base/plugin-sdk \
            packages/store/store \
            packages/equipment/equipment
          do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "skip $name@$version (already published)"
              continue
            fi
            echo "publishing $name@$version"
            (cd "$dir" && pnpm publish --access public --no-git-checks)
          done
