name: ci

on:
  push:
    branches: [master]
    tags-ignore: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: ./.github/actions/prepare-workspace
      # build → vitest → layer gate → wire-catalog gate
      - run: pnpm test
      # The site is a build product; its tracked catalog is enough for a
      # standalone typecheck+build, and the gate catches lost CTAs/assets.
      - run: pnpm --filter @snap-rail/website run build
      - run: pnpm run verify:website
