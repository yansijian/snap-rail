<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="snap-rail-icon-title">
  <title id="snap-rail-icon-title">snap-rail</title>
  <defs>
    <radialGradient id="g-tile" cx="50%" cy="36%" r="78%">
      <stop offset="0" stop-color="#16213a"/>
      <stop offset=".55" stop-color="#0c1220"/>
      <stop offset="1" stop-color="#070a10"/>
    </radialGradient>
    <linearGradient id="g-mod" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cd9ff"/>
      <stop offset="1" stop-color="#4a6cff"/>
    </linearGradient>
    <linearGradient id="g-rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a6cff"/>
      <stop offset="1" stop-color="#3147a1"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#56d8ff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#56d8ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- deep-space tile -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#g-tile)"/>

  <!-- rail + slot -->
  <rect x="72" y="368" width="368" height="30" rx="10" fill="url(#g-rail)"/>
  <rect x="92" y="381" width="328" height="4" rx="2" fill="#070a10" opacity=".55"/>

  <!-- wiring terminals -->
  <rect x="134" y="152" width="22" height="20" rx="3" fill="#3147a1"/>
  <rect x="172" y="152" width="22" height="20" rx="3" fill="#3147a1"/>
  <rect x="318" y="152" width="22" height="20" rx="3" fill="#3147a1"/>
  <rect x="356" y="152" width="22" height="20" rx="3" fill="#3147a1"/>

  <!-- housing -->
  <rect x="108" y="168" width="296" height="156" rx="18" fill="url(#g-mod)"/>

  <!-- touch screen + sheen + live waveform + bezel -->
  <rect x="134" y="192" width="128" height="64" rx="8" fill="#0a101d"/>
  <path d="M134 192 h128 v26 L134 248 Z" fill="#ffffff" opacity=".05"/>
  <path d="M148 240 L170 226 L188 234 L208 214 L226 222 L248 210" fill="none" stroke="#6fd8ff" stroke-width="4" stroke-opacity=".55" stroke-linejoin="round" stroke-linecap="round"/>
  <rect x="134" y="192" width="128" height="64" rx="8" fill="none" stroke="#7fd9ff" stroke-opacity=".28" stroke-width="2.5"/>

  <!-- indicator LEDs + buttons -->
  <circle cx="292" cy="210" r="16" fill="url(#halo)"/>
  <circle cx="292" cy="210" r="8" fill="#8feaff"/>
  <circle cx="320" cy="210" r="8" fill="#33456b"/>
  <rect x="284" y="238" width="34" height="14" rx="7" fill="#2f4270"/>
  <rect x="330" y="238" width="34" height="14" rx="7" fill="#2f4270"/>

  <!-- vents -->
  <rect x="153" y="286" width="44" height="9" rx="4.5" fill="#0a101d" opacity=".38"/>
  <rect x="207" y="286" width="44" height="9" rx="4.5" fill="#0a101d" opacity=".38"/>
  <rect x="261" y="286" width="44" height="9" rx="4.5" fill="#0a101d" opacity=".38"/>
  <rect x="315" y="286" width="44" height="9" rx="4.5" fill="#0a101d" opacity=".38"/>

  <!-- the snap moment -->
  <circle cx="256" cy="346" r="42" fill="url(#halo)"/>
  <path d="M256 327 C259 341.5 263 344.5 283 346 C263 346.5 259 349.5 256 365 C253 349.5 249 346.5 229 346 C249 344.5 253 341.5 256 327 Z" fill="#9feaff"/>
  <circle cx="297" cy="332" r="5" fill="#9feaff" opacity=".85"/>

  <!-- inner tile stroke -->
  <rect x="10" y="10" width="492" height="492" rx="107" fill="none" stroke="#7da0ff" stroke-opacity=".14" stroke-width="3"/>
</svg>
